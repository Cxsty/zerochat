name: Deploy ZeroChat Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy ZeroChat
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Show Wrangler output
        if: always()
        env:
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          WRANGLER_ERROR: ${{ steps.deploy.outputs.command-stderr }}
        run: |
          echo "=== WRANGLER OUTPUT ==="
          echo "$WRANGLER_OUTPUT"
          echo "=== WRANGLER STDERR ==="
          echo "$WRANGLER_ERROR"
